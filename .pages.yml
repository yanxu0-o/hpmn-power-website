  - name: products
    label: Products
    type: file
    path: data/site-data.json
    fields:
      - name: products
        label: Product Cards
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: category, label: Category, type: string }
          - { name: series, label: Series, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Product Image, type: image }
          - name: specs
            label: Spec Tags
            type: string
            list: true

  - name: downloads
    label: Downloads
    type: file
    path: data/site-data.json
    fields:
      - name: downloads
        label: Download Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: type, label: Type, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: File URL, type: string }

  - name: solutions
    label: Solutions
    type: file
    path: data/site-data.json
    fields:
      - name: solutions
        label: Solution Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }

  - name: factory_media
    label: Factory Media
    type: file
    path: data/site-data.json
    fields:
      - name: factoryMedia
        label: Factory Media
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: src, label: Media Path, type: string }
          - { name: type, label: Type, type: string }
          - { name: position, label: Image Position, type: string, required: false }
          - { name: fit, label: Object Fit, type: string, required: false }
