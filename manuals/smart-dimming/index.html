<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HPMN Smart Dimming Power Supply User Manual</title>
    <meta
      name="description"
      content="Read the HPMN Smart Dimming Power Supply User Manual online."
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #15171a;
        --muted: #5d6470;
        --line: #d9dee5;
        --panel: #f6f7f9;
        --brand: #0d5c9e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #ffffff;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .brand {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }

      .brand strong {
        font-size: 18px;
        line-height: 1.2;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      a.button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 13px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
      }

      a.button.primary {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }

      main {
        height: calc(100vh - 69px);
        min-height: 560px;
        background: var(--panel);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .fallback {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
          padding: 12px;
        }

        .brand strong {
          font-size: 16px;
        }

        .actions {
          width: 100%;
          justify-content: stretch;
        }

        a.button {
          flex: 1 1 0;
          padding: 0 10px;
        }

        main {
          height: calc(100vh - 126px);
          min-height: 480px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>HPMN Smart Dimming Power Supply User Manual</strong>
        <span>Online manual</span>
      </div>
      <nav class="actions" aria-label="Manual actions">
        <a class="button" href="../../#downloads">HPMN Website</a>
        <a
          class="button primary"
          href="../../public/downloads/HPMN_Smart_Dimming_Power_Supply_User_Manual_EN.pdf"
        >
          Open PDF
        </a>
      </nav>
    </header>
    <main>
      <iframe
        title="HPMN Smart Dimming Power Supply User Manual PDF"
        src="../../public/downloads/HPMN_Smart_Dimming_Power_Supply_User_Manual_EN.pdf"
      >
        <p class="fallback">
          Your browser cannot show this PDF inline.
          <a href="../../public/downloads/HPMN_Smart_Dimming_Power_Supply_User_Manual_EN.pdf">
            Open the PDF
          </a>
        </p>
      </iframe>
    </main>
  </body>
</html>
